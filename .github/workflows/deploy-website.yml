name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: arc-runner-devness-com

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd website && bun install --frozen-lockfile

      - name: Build website
        run: cd website && bun run build

      - name: Build Docker image
        run: |
          cp -r website/dist website/deploy/dist
          docker build --platform linux/amd64 -t coverit-web:latest website/deploy
          rm -rf website/deploy/dist

      - name: Load SSH key into agent (in-memory only)
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Export image and import into k3s
        run: |
          docker save coverit-web:latest | ssh root@${{ secrets.DEPLOY_HOST }} k3s ctr images import -

      - name: Restart deployment
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} k3s kubectl rollout restart deployment/web -n coverit

      - name: Wait for rollout
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} k3s kubectl rollout status deployment/web -n coverit --timeout=120s
